  <head>
    <script>
      // Filter benign Vite HMR websocket reconnection notices in AI Studio preview environment
      (function() {
        if (typeof window === 'undefined') return;

        function isIgnorableWebSocketNotice(target) {
          if (!target) return false;
          var text = '';
          try {
            if (typeof target === 'string') {
              text = target;
            } else if (target instanceof Error || (target && typeof target === 'object')) {
              text = (target.message || '') + ' ' + (target.stack || '') + ' ' + (target.name || '') + ' ' + String(target);
            } else {
              text = String(target);
            }
          } catch (_) {}
          var lower = text.toLowerCase();
          return (
            lower.indexOf('websocket') !== -1 ||
            lower.indexOf('[vite]') !== -1 ||
            lower.indexOf('@vite/client') !== -1 ||
            lower.indexOf('closed without opened') !== -1 ||
            lower.indexOf('failed to connect to websocket') !== -1
          );
        }

        if (window.console) {
          var origErr = console.error;
          var origWarn = console.warn;
          console.error = function() {
            var args = Array.prototype.slice.call(arguments);
            for (var i = 0; i < args.length; i++) {
              if (isIgnorableWebSocketNotice(args[i])) {
                return;
              }
            }
            return origErr.apply(console, args);
          };
          console.warn = function() {
            var args = Array.prototype.slice.call(arguments);
            for (var i = 0; i < args.length; i++) {
              if (isIgnorableWebSocketNotice(args[i])) {
                return;
              }
            }
            return origWarn.apply(console, args);
          };
        }

        window.addEventListener('error', function(e) {
          if (
            isIgnorableWebSocketNotice(e && (e.error || e.message)) ||
            (e && e.filename && String(e.filename).indexOf('@vite/client') !== -1)
          ) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (
            isIgnorableWebSocketNotice(e && e.reason) ||
            isIgnorableWebSocketNotice(e)
          ) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
