<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Cyan Arc Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#67e8f9"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#083344"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-opacity="0.35" />

  <!-- Outer Tech HUD Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#0284c7" stroke-width="2" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#06b6d4" stroke-width="5" stroke-dasharray="16 12" stroke-opacity="0.6" />
  <circle cx="256" cy="256" r="172" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 8" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-opacity="0.8" />

  <!-- Core Reactor Triangular Tech Nodes -->
  <g transform="translate(256, 256)">
    <!-- Radial reactor segments -->
    <g stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" opacity="0.9" filter="url(#glow)">
      <line x1="0" y1="-140" x2="0" y2="-112" />
      <line x1="99" y1="-99" x2="79" y2="-79" />
      <line x1="140" y1="0" x2="112" y2="0" />
      <line x1="99" y1="99" x2="79" y2="79" />
      <line x1="0" y1="140" x2="0" y2="112" />
      <line x1="-99" y1="99" x2="-79" y2="79" />
      <line x1="-140" y1="0" x2="-112" y2="0" />
      <line x1="-99" y1="-99" x2="-79" y2="-79" />
    </g>

    <!-- Inner reactor ring -->
    <circle cx="0" cy="0" r="95" fill="#030712" stroke="#22d3ee" stroke-width="8" filter="url(#glow)" />
    <circle cx="0" cy="0" r="82" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />

    <!-- Arc Reactor Core Heart -->
    <circle cx="0" cy="0" r="62" fill="url(#coreGlow)" filter="url(#glow)" />
    <circle cx="0" cy="0" r="30" fill="#ffffff" />
  </g>

  <!-- JARVIS Signature Subtitle -->
  <text x="256" y="440" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="26" font-weight="800" fill="#38bdf8" letter-spacing="8" text-anchor="middle" filter="url(#glow)">JARVIS AI</text>
  <text x="256" y="468" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="3" text-anchor="middle">AUTONOMOUS ASSISTANT</text>
</svg>
